[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/cli"]

[workspace.dependencies]
ai_env = "0.1.3"
anyhow = "1.0.104"
async-trait = "0.1.92"
cd_env = "0.4.2"
ci_env = "0.5.2"
clap = "4.6.7"
clap_complete = "4.6.11"
compact_str = { version = "0.10.0", default-features = false, features = [
    "serde",
] }
criterion = { package = "codspeed-criterion-compat", version = "5.0.2", default-features = false, features = [
    "async_tokio",
] }
derive_setters = "0.1.9"
dirs = "7.0.0"
docker_credential = { version = "1.4.0" }
extism = ">=1.6.0" # Lower for consumers
extism-pdk = "1.4.1"
futures = "0.3.34"
hex = { version = "0.4.3", features = ["alloc"] }
http-cache-reqwest = "1.0.0-alpha.9"
indexmap = "2.14.2"
iocraft = "0.9.3"
# iocraft = { git = "https://github.com/ccbrown/iocraft.git", branch = "main" }
miette = "7.6.0"
oci-client = "0.18.0"
once_cell = "1.21.4"
opentelemetry = "0.33.1"
pgp = { version = "0.20.0", default-features = false }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
reqwest = { version = "0.13.5", default-features = false, features = [
    "charset",
    "http2",
    # We don't use openssl but its required for musl builds
    "native-tls-vendored",
] }
reqwest-middleware = { version = "0.5.2", default-features = false, features = [
    "charset",
    "http2",
] }
rmcp = { version = "3.5.0", default-features = false, features = [
    "base64",
    "macros",
] }
rustc-hash = "2.1.3"
scc = "3.8.8"
schemars = "1.2.3"
schematic = { version = "0.20.12", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
shell-words = "1.1.1"
starbase = { version = "0.13.4", features = ["miette", "tracing"] }
starbase_archive = { version = "0.14.7", features = [
    "bz2",
    "dmg",
    "gz",
    "miette",
    "pkg",
    "tar-all",
    "xz",
    "zip-all",
    "zstd",
    "z",
] }
starbase_args = { version = "0.1.16" }
starbase_console = { version = "0.7.0", features = ["miette", "ui"] }
starbase_id = { version = "0.4.0", features = ["miette", "schematic"] }
starbase_sandbox = { version = "0.12.1" }
starbase_shell = { version = "0.14.2", features = ["miette"] }
starbase_styles = { version = "0.6.10" }
starbase_utils = { version = "0.14.8", default-features = false, features = [
    "fs-lock",
    "json",
    "miette",
    "net",
    "toml",
] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["full", "tracing"] }
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }
