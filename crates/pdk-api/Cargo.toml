[package]
name = "proto_pdk_api"
version = "0.35.0"
edition = "2024"
license = "MIT"
description = "Core APIs for creating proto WASM plugins."
homepage = "https://moonrepo.dev/proto"
repository = "https://github.com/moonrepo/proto"
rust-version = "1.85.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
system_env = { version = "0.10.6", path = "../system-env" }
version_spec = { version = "0.11.8", path = "../version-spec" }
warpgate_api = { version = "0.20.1", path = "../warpgate-api" }
derive_setters = { workspace = true }
rustc-hash = { workspace = true }
schematic = { workspace = true, features = ["schema", "schema_serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
schematic = [
	"system_env/schematic",
	"version_spec/schematic",
	"warpgate_api/schematic",
]

# Ensures everything still works with schematic
[dev-dependencies]
proto_pdk_api = { path = ".", features = ["schematic"] }
starbase_sandbox = { workspace = true }
