[package]
name = "proto_core"
version = "0.62.0"
edition = "2024"
license = "MIT"
description = "Core proto APIs."
homepage = "https://moonrepo.dev/proto"
repository = "https://github.com/moonrepo/proto"
rust-version = "1.89.0"

[dependencies]
proto_pdk_api = { version = "0.34.3", path = "../pdk-api", features = [
    "schematic",
] }
proto_shim = { version = "0.8.5", path = "../shim" }
system_env = { version = "0.10.2", path = "../system-env" }
version_spec = { version = "0.11.4", path = "../version-spec", features = [
    "schematic",
] }
warpgate = { version = "0.36.2", path = "../warpgate", features = [
    "miette",
    "schematic",
] }
ai_env = { workspace = true }
clap = { workspace = true, optional = true }
convert_case = "0.12.0"
docker_credential = { workspace = true }
dotenv-ng = { version = "1.0.0", default-features = false }
indexmap = { workspace = true }
iocraft = { workspace = true }
miette = { workspace = true }
minisign-verify = "0.2.5"
oci-client = { workspace = true }
once_cell = { workspace = true }
opentelemetry = { workspace = true, optional = true }
pgp = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rustc-hash = { workspace = true }
scc = { workspace = true }
schematic = { workspace = true, features = [
    "config",
    "env",
    "toml",
    "type_indexmap",
    "type_regex",
    "type_url",
    "validate",
] }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
starbase_archive = { workspace = true }
starbase_console = { workspace = true, features = ["serde", "ui"] }
starbase_sandbox = { workspace = true, optional = true }
starbase_shell = { workspace = true }
starbase_styles = { workspace = true }
starbase_utils = { workspace = true, features = [
    "hash",
    "hash-base64",
    "yaml",
] }
thiserror = { workspace = true }
tokio = { workspace = true }
toml_edit = { workspace = true }
tracing = { workspace = true }
url = { workspace = true, features = ["serde"] }
uuid = { workspace = true }

[dev-dependencies]
proto_core = { path = ".", features = ["test-plugins"] }
rand = "0.8.7"
starbase_sandbox = { workspace = true }
tokio = { workspace = true }

[features]
default = []
clap = ["dep:clap"]
otel = ["dep:opentelemetry"]

# Internal only!
test = ["dep:starbase_sandbox"]
test-plugins = ["test"]
