[package]
name = "system_env"
version = "0.12.0"
edition = "2024"
license = "MIT"
description = "Information about the system environment: operating system, architecture, package manager, etc."
homepage = "https://moonrepo.dev/proto"
repository = "https://github.com/moonrepo/proto"
rust-version = "1.90.0"

[package.metadata.docs.rs]
all-features = true

[dependencies]
# `\d` and `\s` in the list parser patterns require `unicode-perl`
regex = { workspace = true, features = ["unicode-perl"] }
schematic = { workspace = true, optional = true, features = ["schema"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
default = []
schematic = ["dep:schematic"]
