[profile.dev]
# Backtraces only need file/line/function, which this retains in full. Trades
# away debugger variable inspection for a smaller target dir and faster links.
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"

[profile.dist]
inherits = "release"
lto = "thin"
